name: pace-quest
on:
  schedule:
    - cron: "17 4-22 * * *"   # minutt 17, ikke hel time (GitHub dropper/forsinker kjøringer ved timeskiftet); scriptet hopper selv over utenfor 06-23 Oslo
  workflow_dispatch:
concurrency:
  group: pace-quest
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write   # for nøkkelfri innlogging mot Google (Workload Identity Federation)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Google-token for Google Ads API (ingen lagret nøkkel)
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/821915775795/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: pace-dashboard-ads@pace-dashboard-514620.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/adwords
      - name: Bygg og publiser (gjentar hele bygget ved push-kollisjon)
        env:
          PACE_BOARD_TOKEN: ${{ secrets.PACE_BOARD_TOKEN }}
          PACE_PAGE_TOKEN: ${{ secrets.PACE_PAGE_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          STATICRYPT_PASSWORD: ${{ secrets.PACE_QUEST_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKENS_EKSTRA: ${{ secrets.GMAIL_REFRESH_TOKENS_EKSTRA }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_ADS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          PACE_KASSE: ${{ vars.PACE_KASSE }}
          PACE_FORFALL: ${{ vars.PACE_FORFALL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set +x
          git config user.name "pace-quest-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            node scripts/build-pace-quest.mjs
            rm -f pace-quest-plain.html
            git add pace-quest.html
            if git diff --cached --quiet; then echo "ingen endring"; exit 0; fi
            git commit -m "pace-quest: auto-synk $(TZ=Europe/Oslo date '+%d.%m.%Y %H:%M')"
            if git push origin HEAD:main; then exit 0; fi
            echo "push avvist, bygger på nytt ($i)"; sleep 15
          done
          exit 1
