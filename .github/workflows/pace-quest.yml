name: pace-quest
on:
  schedule:
    - cron: "0 4-21 * * *"   # hver hele time 06-23 Oslo (sommertid; 05-22 vintertid)
  workflow_dispatch:
concurrency:
  group: pace-quest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bygg pace-quest.html
        env:
          PACE_BOARD_TOKEN: ${{ secrets.PACE_BOARD_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          STATICRYPT_PASSWORD: ${{ secrets.PACE_QUEST_PASSWORD }}
          PACE_KASSE: ${{ vars.PACE_KASSE }}
        run: node scripts/build-pace-quest.mjs
      - name: Commit hvis endret
        run: |
          set +x
          rm -f pace-quest-plain.html
          git config user.name "pace-quest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pace-quest.html
          if git diff --cached --quiet; then echo "ingen endring"; exit 0; fi
          git commit -m "pace-quest: auto-synk $(TZ=Europe/Oslo date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
